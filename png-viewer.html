<!--
  Version 1.0 - 29.01.2026 00:00:00 GMT

  PNG Viewer: просмотр PNG страниц из data.cache.
-->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>PNG Viewer · tLib</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <!-- Modulepreload: параллельная загрузка всех ES-модулей вместо каскадной.
         Список должен содержать ВСЕ модули из дерева зависимостей entry point (js/png-viewer-init.js).
         При добавлении/удалении/переименовании .js файла — обновите этот список. -->
    <link rel="modulepreload" href="js/utils/freeze.js">
    <link rel="modulepreload" href="js/config/api.config.js">
    <link rel="modulepreload" href="js/png-viewer.js">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-bg: #f5f5f5;
            --color-surface: #ffffff;
            --color-border: #ddd;
            --color-text: #333;
            --color-text-secondary: #666;
            --color-primary: #0066cc;
            --color-primary-hover: #0052a3;
            --color-button-bg: #f0f0f0;
            --color-button-hover: #e0e0e0;
            --toolbar-height: 50px;
            --spacing: 12px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--color-bg);
            color: var(--color-text);
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Toolbar */
        .toolbar {
            background: var(--color-surface);
            border-bottom: 1px solid var(--color-border);
            padding: var(--spacing);
            display: flex;
            align-items: center;
            gap: var(--spacing);
            height: var(--toolbar-height);
            flex-shrink: 0;
            overflow-x: auto;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: fit-content;
        }

        .toolbar-separator {
            width: 1px;
            height: 30px;
            background: var(--color-border);
            margin: 0 4px;
            flex-shrink: 0;
        }

        select, button {
            font-family: inherit;
            font-size: 14px;
            padding: 6px 12px;
            border: 1px solid var(--color-border);
            border-radius: 4px;
            background: var(--color-button-bg);
            color: var(--color-text);
            cursor: pointer;
            transition: background 0.2s;
        }

        select {
            min-width: 200px;
            max-width: 400px;
        }

        button:hover:not(:disabled) {
            background: var(--color-button-hover);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        button:active:not(:disabled) {
            transform: scale(0.98);
        }

        .page-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: var(--color-text-secondary);
            min-width: fit-content;
            white-space: nowrap;
        }

        .page-input {
            width: 60px;
            text-align: center;
            padding: 4px 8px;
            border: 1px solid var(--color-border);
            border-radius: 4px;
            font-size: 14px;
        }

        /* Viewport */
        .viewport {
            flex: 1;
            position: relative;
            overflow: auto;
            background: var(--color-bg);
        }

        .viewport-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 20px;
        }

        .page-container {
            position: relative;
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            max-width: 100%;
        }

        .page-image {
            display: block;
            width: 100%;
            height: auto;
        }

        .page-placeholder {
            aspect-ratio: 210 / 297;
            width: 100%;
            max-width: 800px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
            color: var(--color-text-secondary);
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: var(--color-text-secondary);
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--color-border);
            border-top-color: var(--color-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--color-text-secondary);
        }

        .empty-state h2 {
            font-size: 18px;
            margin-bottom: 8px;
        }

        /* SVG Icons */
        button svg {
            width: 18px;
            height: 18px;
            vertical-align: middle;
            stroke: currentColor;
        }

        button:disabled svg {
            opacity: 0.5;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="toolbar">
            <div class="toolbar-group">
                <button id="firstPageBtn" disabled title="Первая страница (Home)">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m11 17-5-5 5-5"/><path d="m18 17-5-5 5-5"/></svg>
                </button>
                <button id="prevPageBtn" disabled title="Предыдущая (←, PageUp)">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                </button>
                <button id="nextPageBtn" disabled title="Следующая (→, PageDown)">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                </button>
                <button id="lastPageBtn" disabled title="Последняя (End)">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 17 5-5-5-5"/><path d="m13 17 5-5-5-5"/></svg>
                </button>
            </div>

            <div class="toolbar-separator"></div>

            <div class="page-indicator">
                <input type="number" id="pageInput" class="page-input" min="1" disabled title="Введите номер страницы">
                <span id="pageTotal">/ 0</span>
            </div>

            <div class="toolbar-separator"></div>

            <div class="toolbar-group">
                <button id="zoomOutBtn" disabled title="Уменьшить (-, Ctrl+Колесо)">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/><line x1="8" x2="14" y1="11" y2="11"/></svg>
                </button>
                <button id="zoomInBtn" disabled title="Увеличить (+, =, Ctrl+Колесо)">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/><line x1="11" x2="11" y1="8" y2="14"/><line x1="8" x2="14" y1="11" y2="11"/></svg>
                </button>
                <button id="fitWidthBtn" disabled title="По ширине (W)">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 8 4 4-4 4"/><path d="M2 12h20"/><path d="m6 8-4 4 4 4"/></svg>
                </button>
                <button id="fitPageBtn" disabled title="Вся страница (P)">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
                </button>
                <span id="zoomDisplay" style="min-width: 60px; text-align: center;">100%</span>
            </div>

            <div class="toolbar-separator"></div>

            <div class="toolbar-group">
                <button id="rotateLeftBtn" disabled title="Повернуть влево (Shift+R)">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                </button>
                <button id="rotateRightBtn" disabled title="Повернуть вправо (R)">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
                </button>
            </div>
        </div>

        <div class="viewport" id="viewport">
            <div class="viewport-inner" id="viewportInner">
                <div class="empty-state">
                    <div class="loading-spinner"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- СОВМЕСТИМОСТЬ: Внешний модуль для обхода CSP ограничений -->
    <script type="module" src="/js/png-viewer-init.js"></script>
</body>
</html>
