# Version 1.0 - 22.06.2026 12:00:00 GMT
# Конфигурация pytest: по умолчанию прогоняем локальный набор (unit + integration)
# из корня проекта. API-тесты (tests/api) требуют BASE_URL и живого сервера —
# их запускают отдельно из tests/ (см. tests/README.md).
[pytest]
pythonpath = .
testpaths = tests/unit tests/integration
